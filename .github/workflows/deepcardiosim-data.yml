name: DeepCardioSim dataset inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/inventory_deepcardiosim.py"
      - "data/references/deepcardiosim.json"
      - ".github/workflows/deepcardiosim-data.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query pinned Zenodo record
        run: |
          python scripts/inventory_deepcardiosim.py \
            --manifest artifacts/deepcardiosim_manifest.json

      - name: Validate manifest is non-empty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/deepcardiosim_manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          files = manifest.get("files", [])
          if not files:
              raise SystemExit("Zenodo inventory returned no artifacts")
          print(f"inventoried {len(files)} artifacts")
          for item in files:
              print(item["key"], item["size"], item["checksum"])
          PY

      - name: Upload verified inventory
        uses: actions/upload-artifact@v4
        with:
          name: deepcardiosim-manifest
          path: artifacts/deepcardiosim_manifest.json
          if-no-files-found: error
          retention-days: 30
